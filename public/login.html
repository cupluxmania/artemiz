<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Gerbang Inbox</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="gi-root">
  <div class="gi-login-screen">
    <form class="gi-login-card" id="gi-login-form" autocomplete="on">
      <div class="gi-brand-row" style="margin-bottom:6px">
        <span class="gi-dot"></span>
        <h1 class="gi-display" style="font-size:22px">Gerbang Inbox</h1>
      </div>
      <p class="gi-tagline" style="margin-left:0;margin-bottom:22px">Masuk untuk membuka dashboard Anda</p>

      <label class="gi-login-label" for="gi-username">Username</label>
      <input class="gi-login-input" id="gi-username" name="username" autocomplete="username" required autofocus />

      <label class="gi-login-label" for="gi-password">Password</label>
      <input class="gi-login-input" id="gi-password" name="password" type="password" autocomplete="current-password" required />

      <button class="gi-login-btn" id="gi-login-btn" type="submit">Masuk</button>
      <p class="gi-login-error" id="gi-login-error"></p>
    </form>
  </div>

  <script src="/login.js"></script>
</body>
</html>
